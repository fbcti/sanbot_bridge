    <script>
        (() => {
            const storageKey = 'sanbot-client-theme';
            let theme = null;
            try {
                theme = localStorage.getItem(storageKey);
            } catch (error) {
                // Local storage may be unavailable for local files.
            }
            if (theme !== 'dark' && theme !== 'light') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
            document.addEventListener('DOMContentLoaded', () => {
                const button = document.getElementById('themeToggle');
                if (!button) return;
                const updateButton = () => {
                    const dark = document.documentElement.dataset.theme === 'dark';
                    button.textContent = dark ? 'Light mode' : 'Dark mode';
                    button.setAttribute('aria-pressed', String(dark));
                };
                button.addEventListener('click', () => {
                    document.documentElement.dataset.theme =
                        document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                    try {
                        localStorage.setItem(storageKey, document.documentElement.dataset.theme);
                    } catch (error) {
                        // The selected theme still applies to the current page.
                    }
                    updateButton();
                });
                updateButton();
            });
        })();
    </script>

<script>
    const HARD_CODED_WEBSOCKET_URL = `ws://${SANBOT_BRIDGE_IP_ADDRESS}:8088/ws`;
    const HARD_CODED_API_KEY = SANBOT_BRIDGE_API_KEY;
    const BUTTONS_PER_ROW = 6;

    const defaultConfig = {
        title: 'Robot Demo',
        topRow: {
            connectText: 'Connect',
            authorizeText: 'Authorize'
        },
        rows: [],
        inputRow: {
            label: 'Speech Text',
            inputPlaceholder: 'Text to say',
            buttonText: 'Send',
            payload: {
                id: '{{requestId}}',
                type: 'command',
                module: 'speech',
                action: 'say',
                data: {
                    text: '{{input}}'
                }
            }
        }
    };

    const demoConfig = mergeConfig(defaultConfig, window.SANBOT_DEMO_CONFIG || {});

    const pageTitle = document.getElementById('pageTitle');
    const connectionStatus = document.getElementById('connectionStatus');
    const configStatus = document.getElementById('configStatus');
    const commandRows = document.getElementById('commandRows');
    const connectButton = document.getElementById('connectButton');
    const authorizeButton = document.getElementById('authorizeButton');
    const logToggleButton = document.getElementById('logToggleButton');
    const inputLabel = document.getElementById('inputLabel');
    const payloadInput = document.getElementById('payloadInput');
    const inputSendButton = document.getElementById('inputSendButton');
    const trafficLog = document.getElementById('trafficLog');

    let socket = null;
    let requestNumber = 1;
    const pendingRequests = new Map();

    function mergeConfig(base, override) {
        return {
            ...base,
            ...override,
            topRow: {
                ...base.topRow,
                ...(override.topRow || {})
            },
            inputRow: {
                ...base.inputRow,
                ...(override.inputRow || {})
            },
            rows: Array.isArray(override.rows) ? override.rows : base.rows
        };
    }

    function renderDemo() {
        pageTitle.textContent = demoConfig.title || defaultConfig.title;
        connectButton.textContent = demoConfig.topRow.connectText || defaultConfig.topRow.connectText;
        authorizeButton.textContent = demoConfig.topRow.authorizeText || defaultConfig.topRow.authorizeText;
        inputLabel.textContent = demoConfig.inputRow.label || defaultConfig.inputRow.label;
        payloadInput.placeholder = demoConfig.inputRow.inputPlaceholder || '';
        inputSendButton.textContent = demoConfig.inputRow.buttonText || defaultConfig.inputRow.buttonText;

        commandRows.innerHTML = '';

        demoConfig.rows.forEach((row) => {
            const labelRow = document.createElement('tr');
            const labelCell = document.createElement('td');
            labelCell.className = 'label-cell';
            labelCell.colSpan = BUTTONS_PER_ROW;
            labelCell.textContent = row.label || '';
            labelRow.appendChild(labelCell);
            commandRows.appendChild(labelRow);

            const buttonRow = document.createElement('tr');
            const buttons = Array.isArray(row.buttons) ? row.buttons : [];

            for (let column = 0; column < BUTTONS_PER_ROW; column += 1) {
                const cell = document.createElement('td');
                cell.className = 'button-cell';
                const command = buttons[column];

                if (command) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = command.text || `Button ${column + 1}`;
                    button.addEventListener('click', () => sendCommandPayload(command.payload));
                    cell.appendChild(button);
                }

                buttonRow.appendChild(cell);
            }

            commandRows.appendChild(buttonRow);
        });
    }

    function setConnectionStatus(text, kind) {
        connectionStatus.textContent = text;
        connectionStatus.className = 'status';
        if (kind) {
            connectionStatus.classList.add(kind);
        }
    }

    function setConfigStatus(text, kind) {
        configStatus.textContent = text;
        configStatus.className = 'status';
        if (kind) {
            configStatus.classList.add(kind);
        }
    }

    function nextRequestId() {
        const id = `req-${requestNumber}`;
        requestNumber += 1;
        return id;
    }

    function connectWebSocket() {
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
            addLog('Socket already active.');
            return;
        }

        socket = new WebSocket(HARD_CODED_WEBSOCKET_URL);
        pendingRequests.clear();
        setConnectionStatus('Connecting', null);
        addLog(`CONNECT ${HARD_CODED_WEBSOCKET_URL}`);

        socket.addEventListener('open', () => {
            setConnectionStatus('Connected', 'ok');
            addLog('CONNECTED');
        });

        socket.addEventListener('message', (event) => {
            handleIncomingMessage(event.data);
        });

        socket.addEventListener('close', (event) => {
            pendingRequests.clear();
            setConnectionStatus('Disconnected', null);
            addLog(`CLOSED ${event.code}${event.reason ? ` ${event.reason}` : ''}`);
        });

        socket.addEventListener('error', () => {
            pendingRequests.clear();
            setConnectionStatus('Socket error', 'error');
            addLog('ERROR WebSocket error');
        });
    }

    function sendAuthorizePayload() {
        const sent = sendCommandPayload({
            id: '{{requestId}}',
            type: 'command',
            module: 'bridge',
            action: 'authorize',
            data: {
                key: '{{apiKey}}'
            }
        });
        if (sent) {
            setConnectionStatus('Authorizing', null);
        }
    }

    function sendInputPayload() {
        sendCommandPayload(demoConfig.inputRow.payload, {
            input: payloadInput.value
        });
    }

    function sendCommandPayload(payloadTemplate, contextOverrides) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
            addLog('ERROR Connect the WebSocket first.');
            return false;
        }

        const context = {
            requestId: nextRequestId(),
            apiKey: HARD_CODED_API_KEY,
            input: '',
            ...(contextOverrides || {})
        };

        let payload;
        try {
            payload = resolvePayload(payloadTemplate, context);
        } catch (error) {
            addLog(`ERROR ${String(error.message || error)}`);
            return false;
        }

        if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
            addLog('ERROR Payload must resolve to a JSON object.');
            return false;
        }

        if (!Object.prototype.hasOwnProperty.call(payload, 'id')) {
            payload.id = context.requestId;
        }

        if (payload.data && typeof payload.data === 'object' && !Array.isArray(payload.data) && Object.keys(payload.data).length === 0) {
            delete payload.data;
        }

        const serialized = JSON.stringify(payload);
        socket.send(serialized);
        pendingRequests.set(payload.id, {
            type: payload.type,
            module: payload.module,
            action: payload.action
        });
        addLog(`SEND ${JSON.stringify(payload, null, 2)}`);
        return true;
    }

    function resolvePayload(value, context) {
        if (typeof value === 'string') {
            const trimmed = value.trim();
            const replaced = replaceToken(
                replaceToken(
                    replaceToken(value, '{{requestId}}', context.requestId),
                    '{{apiKey}}',
                    context.apiKey
                ),
                '{{input}}',
                context.input
            );

            if (!trimmed.startsWith('{{') && (trimmed.startsWith('{') || trimmed.startsWith('['))) {
                return resolvePayload(JSON.parse(replaced), context);
            }

            return replaced;
        }

        if (Array.isArray(value)) {
            return value.map((item) => resolvePayload(item, context));
        }

        if (value && typeof value === 'object') {
            const resolved = {};
            Object.keys(value).forEach((key) => {
                resolved[key] = resolvePayload(value[key], context);
            });
            return resolved;
        }

        return value;
    }

    function replaceToken(value, token, replacement) {
        return String(value).split(token).join(String(replacement));
    }

    function handleIncomingMessage(message) {
        addLog(`RECV ${formatMessage(message)}`);

        if (typeof message !== 'string') {
            return;
        }

        let payload;
        try {
            payload = JSON.parse(message);
        } catch (error) {
            return;
        }

        const pending = payload && payload.id ? pendingRequests.get(payload.id) : null;
        if (pending) {
            pendingRequests.delete(payload.id);
        }

        if (pending && pending.module === 'bridge' && pending.action === 'authorize') {
            const authorized = isSuccessResponse(payload);
            const authorizationLevel = authorized ? extractAuthorizationLevel(payload) : null;
            setConnectionStatus(
                authorized && authorizationLevel ? formatAuthorizationLevel(authorizationLevel) : authorized ? 'Authorized' : 'Unauthorized',
                authorized ? 'ok' : 'error'
            );
        }
    }

    function isSuccessResponse(response) {
        if (!response || response.type !== 'response') {
            return false;
        }

        if (Object.prototype.hasOwnProperty.call(response, 'code')) {
            const code = Number(response.code);
            return code === 0 || (Number.isFinite(code) && code >= 200 && code < 300);
        }

        if (typeof response.response === 'string') {
            return response.response.toLowerCase() === 'ok';
        }

        if (typeof response.message === 'string') {
            return response.message.toUpperCase() === 'OK';
        }

        return response.error == null;
    }

    function extractAuthorizationLevel(response) {
        if (!response || response.data == null) {
            return response.description || response.message || null;
        }

        if (typeof response.data === 'string') {
            return response.data.trim() || null;
        }

        if (typeof response.data === 'object') {
            return response.data.authorizationLevel || response.data.level || response.data.value || response.description || response.message || null;
        }

        return String(response.data);
    }

    function formatAuthorizationLevel(level) {
        return String(level).trim();
    }

    function formatMessage(message) {
        if (typeof message !== 'string') {
            return '[binary message]';
        }

        try {
            return JSON.stringify(JSON.parse(message), null, 2);
        } catch (error) {
            return message;
        }
    }

    function addLog(message) {
        const timestamp = new Date().toLocaleTimeString();
        trafficLog.textContent = `[${timestamp}] ${message}\n${trafficLog.textContent}`;
    }

    function toggleTrafficLog() {
        const isHidden = trafficLog.hidden;
        trafficLog.hidden = !isHidden;
        logToggleButton.textContent = isHidden ? 'Hide Log' : 'Show Log';
    }

    connectButton.addEventListener('click', connectWebSocket);
    authorizeButton.addEventListener('click', sendAuthorizePayload);
    logToggleButton.addEventListener('click', toggleTrafficLog);
    inputSendButton.addEventListener('click', sendInputPayload);
    payloadInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            sendInputPayload();
        }
    });

    if (!window.SANBOT_DEMO_CONFIG) {
        setConfigStatus('Missing dashboard-console-source.js', 'error');
    }

    renderDemo();
</script>
</body>
</html>
